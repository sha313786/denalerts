<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f4ff" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded D Outline -->
  <path d="M 22 14 H 56 C 76 14 86 28 86 50 C 86 72 76 86 56 86 H 22 V 14 Z" 
        stroke="url(#neonCyanGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="rgba(0, 240, 255, 0.05)"
        filter="url(#cyanGlow)" />

  <!-- Core Electric Lightning Bolt -->
  <polygon points="52 24 30 52 48 52 40 76 68 44 50 44 58 24" 
           fill="url(#neonCyanGrad)" 
           filter="url(#cyanGlow)" />
</svg>