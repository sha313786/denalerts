<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DenAlerts • Live Stream Goal Bar (OBS Widget)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    body.preview-backdrop {
      background: #080c16 !important;
    }

    /* High-contrast solid obsidian container for maximum stream legibility */
    .widget-container {
      width: 100%;
      max-width: 650px;
      padding: 16px 22px 14px 22px;
      background: rgba(6, 9, 18, 0.96);
      border-radius: 16px;
      border: 2px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(0, 240, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .widget-container.bump {
      transform: scale(1.025);
      border-color: rgba(16, 185, 129, 0.8) !important;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.95), 0 0 35px rgba(16, 185, 129, 0.5) !important;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }

    .goal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .goal-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(99, 102, 241, 0.35));
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .goal-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #ffffff;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 4px #000000, 0 0 8px rgba(0, 0, 0, 0.95), 0 0 2px #000000;
    }

    .percentage-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14.5px;
      font-weight: 900;
      padding: 4px 13px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      border: 1.5px solid #00f0ff;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
      text-shadow: 0 1px 3px #000000;
      transition: all 0.3s ease;
    }

    .percentage-badge.completed {
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      border-color: #34d399;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.6);
    }

    /* Progress Track & Fill - Beefy 28px height */
    .progress-track {
      width: 100%;
      height: 28px;
      background: #04070f;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 12px;
      background: linear-gradient(90deg, #00f0ff 0%, #3b82f6 50%, #10b981 100%);
      transition: width 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.65), 0 0 10px #10b981;
    }

    /* Glowing Laser Cap at Leading Tip */
    .progress-fill::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 12px 3px #00f0ff, 0 0 6px #ffffff;
    }

    /* Animated Shimmer Laser */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.5) 50%, transparent 100%);
      animation: shimmer 2.5s infinite;
      border-radius: 12px;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Floating Bump Pill on donation */
    .bump-floater {
      position: absolute;
      top: -26px;
      right: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #34d399;
      background: rgba(4, 45, 34, 0.96);
      padding: 4px 12px;
      border-radius: 10px;
      border: 1.5px solid #34d399;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.8), 0 0 20px rgba(52, 211, 153, 0.6);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 10;
    }

    .bump-floater.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Footer Amounts Row */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .current-amount {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .amount-label {
      font-size: 12px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.8px;
      text-shadow: 0 1px 3px #000000;
    }

    .goal-amount-raised {
      font-size: 19px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 2px 4px #000000, 0 0 14px rgba(0, 240, 255, 0.7);
    }

    .target-amount {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .goal-amount-target {
      font-size: 17px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px #000000, 0 0 8px rgba(0, 0, 0, 0.9);
    }

    .watermark-badge {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      text-shadow: 0 1px 2px #000000;
    }

    /* Pro Lock State */
    .locked-container {
      width: 100%;
      max-width: 580px;
      padding: 24px 20px;
      background: rgba(6, 9, 18, 0.96);
      border-radius: 16px;
      border: 2px solid rgba(239, 68, 68, 0.45);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .locked-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.2);
      border: 1.5px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      font-size: 20px;
      margin-bottom: 12px;
    }

    .locked-title {
      font-size: 17px;
      font-weight: 800;
      color: #f87171;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .locked-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .pro-pill {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Theme: Gold */
    body.theme-gold .widget-container {
      border-color: rgba(245, 158, 11, 0.65);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(245, 158, 11, 0.35);
    }
    body.theme-gold .progress-fill {
      background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 60%, #10b981 100%);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.65);
    }
    body.theme-gold .progress-fill::before {
      box-shadow: 0 0 12px 3px #fbbf24, 0 0 6px #ffffff;
    }
    body.theme-gold .percentage-badge {
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      border-color: #fbbf24;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.45);
    }
    body.theme-gold .goal-amount-raised {
      color: #fbbf24;
      text-shadow: 0 2px 4px #000000, 0 0 14px rgba(245, 158, 11, 0.7);
    }
    body.theme-gold .goal-icon {
      border-color: rgba(245, 158, 11, 0.5);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    /* Theme: Purple / Cyber Neon */
    body.theme-purple .widget-container {
      border-color: rgba(168, 85, 247, 0.65);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(168, 85, 247, 0.35);
    }
    body.theme-purple .progress-fill {
      background: linear-gradient(90deg, #a855f7 0%, #ec4899 60%, #06b6d4 100%);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.65);
    }
    body.theme-purple .progress-fill::before {
      box-shadow: 0 0 12px 3px #ec4899, 0 0 6px #ffffff;
    }
    body.theme-purple .percentage-badge {
      background: rgba(168, 85, 247, 0.25);
      color: #c084fc;
      border-color: #c084fc;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.45);
    }
    body.theme-purple .goal-amount-raised {
      color: #c084fc;
      text-shadow: 0 2px 4px #000000, 0 0 14px rgba(168, 85, 247, 0.7);
    }
    body.theme-purple .goal-icon {
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    /* Theme: Emerald Matrix */
    body.theme-emerald .widget-container {
      border-color: rgba(16, 185, 129, 0.65);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(16, 185, 129, 0.35);
    }
    body.theme-emerald .progress-fill {
      background: linear-gradient(90deg, #10b981 0%, #34d399 60%, #fbbf24 100%);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.65);
    }
    body.theme-emerald .progress-fill::before {
      box-shadow: 0 0 12px 3px #34d399, 0 0 6px #ffffff;
    }
    body.theme-emerald .percentage-badge {
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      border-color: #34d399;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
    }
    body.theme-emerald .goal-amount-raised {
      color: #34d399;
      text-shadow: 0 2px 4px #000000, 0 0 14px rgba(16, 185, 129, 0.7);
    }
    body.theme-emerald .goal-icon {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    /* Theme: Crimson Fury */
    body.theme-crimson .widget-container {
      border-color: rgba(239, 68, 68, 0.65);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px rgba(239, 68, 68, 0.35);
    }
    body.theme-crimson .progress-fill {
      background: linear-gradient(90deg, #ef4444 0%, #f97316 60%, #fbbf24 100%);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.65);
    }
    body.theme-crimson .progress-fill::before {
      box-shadow: 0 0 12px 3px #f97316, 0 0 6px #ffffff;
    }
    body.theme-crimson .percentage-badge {
      background: rgba(239, 68, 68, 0.25);
      color: #f87171;
      border-color: #f87171;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
    }
    body.theme-crimson .goal-amount-raised {
      color: #f87171;
      text-shadow: 0 2px 4px #000000, 0 0 14px rgba(239, 68, 68, 0.7);
    }
    body.theme-crimson .goal-icon {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    /* Theme: Simple Minimalist Streamer */
    body.theme-simple .widget-container {
      background: rgba(6, 9, 18, 0.96) !important;
      border: 2px solid rgba(0, 240, 255, 0.45) !important;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 240, 255, 0.2) !important;
      padding: 12px 18px !important;
      border-radius: 14px !important;
      max-width: 540px !important;
    }
    body.theme-simple .header-row {
      margin-bottom: 8px;
    }
    body.theme-simple .goal-icon {
      width: 26px;
      height: 26px;
      font-size: 13px;
    }
    body.theme-simple .goal-title {
      font-size: 16px;
    }
    body.theme-simple .progress-track {
      height: 22px;
    }
    body.theme-simple .watermark-badge {
      display: none;
    }

    /* Theme: Capsule */
    body.theme-capsule .widget-container {
      background: rgba(6, 9, 18, 0.96) !important;
      border: 2px solid rgba(0, 240, 255, 0.45) !important;
      border-radius: 30px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.25) !important;
      padding: 10px 18px !important;
      max-width: 520px;
    }
    body.theme-capsule .progress-track {
      height: 18px;
      border-radius: 12px;
    }
    body.theme-capsule .progress-fill {
      border-radius: 12px;
    }

    /* Custom Pro Theme (Dynamic User Palette) */
    :root {
      --goal-bar-start: #00f0ff;
      --goal-bar-end: #ec4899;
      --goal-glow: #00f0ff;
      --goal-border: rgba(0, 240, 255, 0.5);
      --goal-text: #00f0ff;
      --goal-bg: rgba(6, 9, 18, 0.96);
    }
    body.theme-custom .widget-container {
      background: var(--goal-bg) !important;
      border-color: var(--goal-border) !important;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95), 0 0 25px var(--goal-glow) !important;
    }
    body.theme-custom .progress-fill {
      background: linear-gradient(90deg, var(--goal-bar-start) 0%, var(--goal-bar-end) 100%) !important;
      box-shadow: 0 0 20px var(--goal-glow) !important;
    }
    body.theme-custom .progress-fill::before {
      box-shadow: 0 0 12px 3px var(--goal-glow), 0 0 6px #ffffff !important;
    }
    body.theme-custom .percentage-badge {
      background: rgba(0, 0, 0, 0.5) !important;
      color: var(--goal-text) !important;
      border-color: var(--goal-border) !important;
      box-shadow: 0 0 14px var(--goal-glow) !important;
    }
    body.theme-custom .goal-amount-raised {
      color: var(--goal-text) !important;
      text-shadow: 0 2px 4px #000000, 0 0 14px var(--goal-glow) !important;
    }
    body.theme-custom .goal-icon {
      border-color: var(--goal-border) !important;
    }

    /* Mobile & Compact Screen Responsiveness */
    @media (max-width: 540px) {
      body {
        padding: 8px;
      }
      .widget-container {
        max-width: 100%;
        padding: 12px 14px;
      }
      .goal-title {
        font-size: 15px;
      }
      .percentage-badge {
        font-size: 12.5px;
        padding: 3px 8px;
      }
      .progress-track {
        height: 22px;
      }
      .goal-amount-raised {
        font-size: 16px;
      }
      .goal-amount-target {
        font-size: 14px;
      }
      .watermark-badge {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- PRO GOAL WIDGET VIEW -->
  <div id="goal-widget" class="widget-container">
    <div id="bump-floater" class="bump-floater">+₹100</div>

    <div class="header-row">
      <div class="goal-title-wrap">
        <span class="goal-icon">🎯</span>
        <span id="goal-title" class="goal-title">Live Stream Goal</span>
      </div>
      <span id="goal-percentage" class="percentage-badge">0%</span>
    </div>

    <div class="progress-track">
      <div id="goal-fill" class="progress-fill"></div>
    </div>

    <div class="footer-row">
      <div class="current-amount">
        <span class="amount-label">RAISED:</span>
        <span id="goal-current" class="goal-amount-raised">₹0</span>
      </div>
      <span class="watermark-badge">⚡ DENALERTS PRO</span>
      <div class="target-amount">
        <span class="amount-label">GOAL:</span>
        <span id="goal-target" class="goal-amount-target">₹1,000</span>
      </div>
    </div>
  </div>

  <!-- LOCKED STATE VIEW (FOR FREE TIER CREATORS) -->
  <div id="locked-widget" class="locked-container" style="display: none;">
    <div class="locked-icon">🔒</div>
    <div class="locked-title">DenAlerts Pro Required</div>
    <div class="locked-desc">
      The <strong>Live Stream Goal Bar</strong> is an exclusive <strong>Creator Pro</strong> feature.<br>
      Upgrade your account at <strong>alerts.denbooks.in</strong> to activate this widget on your stream.
    </div>
    <div class="pro-pill">👑 Upgrade to Pro</div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const streamId = urlParams.get('id') || urlParams.get('code') || urlParams.get('stream') || urlParams.get('channel') || 'default';
      const customTheme = urlParams.get('theme'); // 'gold' | 'purple' | 'simple' | 'capsule' | 'custom' | 'default'

      function applyCustomColors(colors) {
        if (!colors) return;
        const root = document.documentElement;
        if (colors.barStart) root.style.setProperty('--goal-bar-start', colors.barStart);
        if (colors.barEnd) root.style.setProperty('--goal-bar-end', colors.barEnd);
        if (colors.glow) {
          root.style.setProperty('--goal-glow', colors.glow);
          root.style.setProperty('--goal-border', colors.glow);
        }
        if (colors.text) root.style.setProperty('--goal-text', colors.text);
        if (colors.bg) root.style.setProperty('--goal-bg', colors.bg);
      }

      function applyGoalTheme(themeName, customColors) {
        if (!themeName) return;
        const theme = String(themeName).toLowerCase().trim();
        const themes = ['theme-default', 'theme-simple', 'theme-capsule', 'theme-gold', 'theme-purple', 'theme-emerald', 'theme-crimson', 'theme-custom'];
        themes.forEach(cls => document.body.classList.remove(cls));
        if (theme && theme !== 'default') {
          document.body.classList.add('theme-' + theme);
        }
        if (customColors) {
          applyCustomColors(customColors);
        }
      }

      if (customTheme) {
        applyGoalTheme(customTheme);
      }

      // Check URL query params for custom color overrides
      const qBar1 = urlParams.get('bar1') || urlParams.get('start');
      const qBar2 = urlParams.get('bar2') || urlParams.get('end');
      const qGlow = urlParams.get('glow');
      const qText = urlParams.get('text');
      if (qBar1 || qBar2 || qGlow || qText) {
        applyCustomColors({ barStart: qBar1, barEnd: qBar2, glow: qGlow, text: qText });
      }

      if (urlParams.get('preview') === '1') {
        document.body.classList.add('preview-backdrop');
      }

      const widgetEl = document.getElementById('goal-widget');
      const lockedEl = document.getElementById('locked-widget');
      const titleEl = document.getElementById('goal-title');
      const currentEl = document.getElementById('goal-current');
      const targetEl = document.getElementById('goal-target');
      const fillEl = document.getElementById('goal-fill');
      const pctEl = document.getElementById('goal-percentage');
      const bumpFloater = document.getElementById('bump-floater');

      // OBS Browser Source Sizing & Alignment
      const scaleParam = parseFloat(urlParams.get('scale'));
      if (scaleParam && scaleParam >= 0.4 && scaleParam <= 3.0) {
        widgetEl.style.transform = `scale(${scaleParam})`;
        widgetEl.style.transformOrigin = (urlParams.get('align') === 'top' || urlParams.get('top') === '1') ? 'top center' : 'center center';
      }
      if (urlParams.get('align') === 'top' || urlParams.get('top') === '1') {
        document.body.style.alignItems = 'flex-start';
        document.body.style.paddingTop = '10px';
      }

      const LOCAL_GOAL_KEY = 'denalerts_obs_goal_' + streamId;
      let currentGoal = {
        title: 'Live Stream Goal',
        target: 1000,
        current: 0,
        enabled: true
      };
      let isProTier = false;
      let hasCelebrated = false;

      // Immediate synchronous restore from LocalStorage
      try {
        const cachedGoal = JSON.parse(localStorage.getItem(LOCAL_GOAL_KEY));
        if (cachedGoal) {
          updateGoalDisplay(cachedGoal);
        }
      } catch (_) {}

      function formatINR(val) {
        const num = parseFloat(val) || 0;
        return '₹' + num.toLocaleString('en-IN');
      }

      function updateGoalDisplay(goal) {
        if (!goal) return;
        const title = goal.title !== undefined ? goal.title : (goal.goalTitle !== undefined ? goal.goalTitle : currentGoal.title);
        const target = goal.target !== undefined ? goal.target : (goal.goalTarget !== undefined ? goal.goalTarget : currentGoal.target);
        const current = goal.current !== undefined ? goal.current : (goal.goalCurrent !== undefined ? goal.goalCurrent : currentGoal.current);
        const enabled = goal.enabled !== undefined ? goal.enabled : (goal.goalEnabled !== undefined ? goal.goalEnabled : currentGoal.enabled);
        const theme = goal.theme !== undefined ? goal.theme : (goal.goalTheme !== undefined ? goal.goalTheme : null);
        const customColors = goal.goalCustomColors || goal.customColors;

        if (theme) {
          applyGoalTheme(theme, customColors);
        } else if (customColors) {
          applyCustomColors(customColors);
        }

        currentGoal = {
          title: title || 'Live Stream Goal',
          target: Math.max(1, parseFloat(target) || 1000),
          current: Math.max(0, parseFloat(current) || 0),
          enabled: enabled !== false
        };

        try {
          localStorage.setItem(LOCAL_GOAL_KEY, JSON.stringify(currentGoal));
        } catch (_) {}

        titleEl.textContent = currentGoal.title;
        currentEl.textContent = formatINR(currentGoal.current);
        targetEl.textContent = formatINR(currentGoal.target);

        const pct = Math.min(100, Math.round((currentGoal.current / currentGoal.target) * 100));

        fillEl.style.width = pct + '%';
        pctEl.textContent = pct + '%';

        if (pct >= 100) {
          pctEl.classList.add('completed');
          pctEl.textContent = '🎉 100%';

          if (!hasCelebrated && window.confetti) {
            hasCelebrated = true;
            window.confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.7 }
            });
          }
        } else {
          pctEl.classList.remove('completed');
          hasCelebrated = false;
        }
      }

      function triggerBump(amount) {
        widgetEl.classList.add('bump');
        bumpFloater.textContent = '+' + formatINR(amount);
        bumpFloater.classList.add('show');

        setTimeout(() => {
          widgetEl.classList.remove('bump');
          bumpFloater.classList.remove('show');
        }, 1200);
      }

      // Initial Fetch & Active Polling Sync
      async function fetchInitial() {
        try {
          const res = await fetch('/api/goal?code=' + encodeURIComponent(streamId));
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();

          isProTier = Boolean(data.isPro);
          if (isProTier) {
            lockedEl.style.display = 'none';
            widgetEl.style.display = 'block';

            let serverGoal = data.goal || {};
            try {
              const cachedGoal = JSON.parse(localStorage.getItem(LOCAL_GOAL_KEY));
              if (cachedGoal) {
                // If server returns cold-start default "Live Stream Goal", prefer user's customized goal
                if (serverGoal.title === 'Live Stream Goal' && cachedGoal.title && cachedGoal.title !== 'Live Stream Goal') {
                  serverGoal.title = cachedGoal.title;
                  serverGoal.target = cachedGoal.target || serverGoal.target;
                  serverGoal.theme = cachedGoal.theme || serverGoal.theme;
                }
              }
            } catch (_) {}
            updateGoalDisplay(serverGoal);
          } else {
            widgetEl.style.display = 'none';
            lockedEl.style.display = 'block';
          }
        } catch (err) {
          console.warn('[Goal] Fetch error, defaulting to offline display:', err.message);
          widgetEl.style.display = 'block';
          updateGoalDisplay(currentGoal);
        }
      }

      // WebSocket Real-Time Live Sync
      function connectWs() {
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${window.location.host}/?code=${encodeURIComponent(streamId)}`;
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
          console.log('[Goal Widget] WebSocket connected to stream [' + streamId + ']');
        };

        socket.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'INIT') {
              const sub = msg.data.subscription;
              const isPro = sub && (sub.plan === 'pro' || sub.plan === 'pro_trial' || (sub.features && sub.features.goalBars));
              isProTier = Boolean(isPro);

              if (isProTier) {
                lockedEl.style.display = 'none';
                widgetEl.style.display = 'block';
                if (msg.data.settings) {
                  updateGoalDisplay({
                    title: msg.data.settings.goalTitle,
                    target: msg.data.settings.goalTarget,
                    current: msg.data.settings.goalCurrent,
                    enabled: msg.data.settings.goalEnabled,
                    theme: msg.data.settings.goalTheme,
                    goalTheme: msg.data.settings.goalTheme,
                    goalCustomColors: msg.data.settings.goalCustomColors
                  });
                }
              } else {
                widgetEl.style.display = 'none';
                lockedEl.style.display = 'block';
              }
            }

            if (msg.type === 'SUBSCRIPTION_UPDATED') {
              const sub = msg.data;
              const isPro = sub && (sub.plan === 'pro' || sub.plan === 'pro_trial' || (sub.features && sub.features.goalBars));
              isProTier = Boolean(isPro);
              if (isProTier) {
                lockedEl.style.display = 'none';
                widgetEl.style.display = 'block';
              } else {
                widgetEl.style.display = 'none';
                lockedEl.style.display = 'block';
              }
            }

            if (msg.type === 'GOAL_UPDATED') {
              if (isProTier && msg.data) {
                updateGoalDisplay(msg.data);
              }
            }

            if (msg.type === 'SETTINGS_UPDATED') {
              if (isProTier && msg.data) {
                updateGoalDisplay(msg.data);
              }
            }

            if (msg.type === 'NEW_PAYMENT') {
              if (isProTier && msg.data) {
                const amt = parseFloat(msg.data.amount) || 0;
                triggerBump(amt);
              }
            }
          } catch (e) {
            console.error('[Goal Widget] Message parse error:', e);
          }
        };

        socket.onerror = (err) => {
          console.warn('[Goal Widget] WebSocket error:', err);
        };

        socket.onclose = () => {
          setTimeout(connectWs, 2000);
        };
      }

      fetchInitial();
      const isServerlessDomain = window.location.hostname.includes('vercel.app') || window.location.hostname.includes('denbooks.in');
      if (!isServerlessDomain) {
        connectWs();
      }

      // Background fallback poll every 2.5 seconds for continuous 100% sync
      setInterval(fetchInitial, 2500);
    })();
  </script>
  <script src="/confetti.min.js" defer></script>
</body>
</html>
