<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DenAlerts — Creator Sign In &amp; Account Portal</title>
  <meta name="description" content="Access your live stream UPI alert cockpit, pairing PIN, anti-spam filters, voice personas, and goal widgets.">

  <!-- Discord & Open Graph Social Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alerts.denbooks.in/login">
  <meta property="og:site_name" content="SRB STUDIOS">
  <meta property="og:title" content="DenAlerts — Creator Cockpit Sign In">
  <meta property="og:description" content="Access your live stream UPI alert cockpit, pairing PIN, anti-spam filters, voice personas, and goal widgets.">
  <meta property="og:image" content="https://alerts.denbooks.in/og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="theme-color" content="#00f0ff">

  <!-- Twitter / X Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://alerts.denbooks.in/og-banner.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/landing.css?v=21">
  <style>
    .auth-page {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: rgba(14, 18, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 30px rgba(16, 185, 129, 0.05);
      backdrop-filter: blur(20px);
      text-align: left;
      position: relative;
    }

    .auth-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .auth-title {
      font-size: 23px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }

    .auth-subtitle {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Tab Switcher */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 22px;
    }

    .auth-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .auth-tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Forms */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-input {
      width: 100%;
      padding: 12px 14px;
      background: #080c14;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-input:focus {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .auth-input::placeholder {
      color: #475569;
    }

    /* Error Banner */
    .auth-error {
      display: none;
      padding: 10px 14px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 12.5px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    /* Success Banner */
    .auth-success {
      display: none;
      padding: 10px 14px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      color: #34d399;
      font-size: 12.5px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .auth-submit-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      background: var(--accent-emerald);
      color: #04100c;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 4px;
    }

    .auth-submit-btn:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
    }

    .auth-submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-footer-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 11.5px;
      color: var(--text-tertiary);
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      .auth-page {
        padding: 20px 12px;
      }
      .auth-card {
        padding: 24px 18px;
        border-radius: 16px;
      }
      .auth-title {
        font-size: 20px;
      }
      .navbar .container {
        padding: 0 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Nav -->
  <nav class="navbar">
    <div class="container nav-wrap">
      <a href="/" class="nav-brand">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="brand-name">Den<span>Alerts</span></div>
      </a>

      <div class="nav-actions">
        <a href="/" class="btn btn-secondary btn-sm">
          <span>&larr; Back to Home</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-emerald)" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1 class="auth-title" id="auth-header-title">Creator Sign In</h1>
      <p class="auth-subtitle" id="auth-header-sub">Access your personal stream alerts cockpit, overlay keys, and custom voice models.</p>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Error / Success Banners -->
      <div id="auth-error" class="auth-error"></div>
      <div id="auth-success" class="auth-success"></div>

      <!-- Tab 1: Sign In Form -->
      <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Streamer Email</label>
          <div class="input-wrap">
            <input type="email" id="login-email" class="auth-input" placeholder="creator@example.com" required autocomplete="email" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <input type="password" id="login-password" class="auth-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="auth-submit-btn">
          <span>Sign In to Cockpit</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <!-- Tab 2: Create Account Form -->
      <form id="form-register" class="auth-form" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-channel">Streamer / Channel Name</label>
          <div class="input-wrap">
            <input type="text" id="reg-channel" class="auth-input" placeholder="e.g. SRB Studios" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="reg-email" class="auth-input" placeholder="creator@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password (min 6 characters)</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" class="auth-input" placeholder="Create a secure password" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="btn-reg-submit" class="auth-submit-btn">
          <span>Create Streamer Account</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </form>

      <div class="auth-footer-note">
        Protected with cryptographically salted scrypt hashes. Your pairing PIN and stream alerts are private to your account.
      </div>
    </div>
  </div>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const authHeaderTitle = document.getElementById('auth-header-title');
    const authHeaderSub = document.getElementById('auth-header-sub');
    const errorBox = document.getElementById('auth-error');
    const successBox = document.getElementById('auth-success');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    function showSuccess(msg) {
      successBox.textContent = msg;
      successBox.style.display = 'block';
      errorBox.style.display = 'none';
    }

    function clearAlerts() {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
    }

    function switchAuthTab(tab) {
      clearAlerts();
      if (tab === 'register') {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        formRegister.style.display = 'flex';
        formLogin.style.display = 'none';
        authHeaderTitle.textContent = 'Create Streamer Account';
        authHeaderSub.textContent = 'Set up your zero-commission UPI alert engine in under 30 seconds.';
        document.getElementById('reg-channel').focus();
      } else {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        formLogin.style.display = 'flex';
        formRegister.style.display = 'none';
        authHeaderTitle.textContent = 'Creator Sign In';
        authHeaderSub.textContent = 'Access your personal stream alerts cockpit, overlay keys, and custom voice models.';
        document.getElementById('login-email').focus();
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlerts();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          showSuccess('Authenticated successfully! Loading your cockpit...');
          localStorage.setItem('denalerts_auth_token', data.token);
          localStorage.setItem('denalerts_user', JSON.stringify(data.user));
          localStorage.setItem('stream_session_code', data.user.streamerKey);
          localStorage.setItem('streamer_code', data.user.streamerKey);

          setTimeout(() => {
            window.location.href = `/dashboard?code=${encodeURIComponent(data.user.streamerKey)}`;
          }, 400);
        } else {
          showError(data.error || 'Invalid credentials. Please verify your email and password.');
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Cockpit</span>';
        }
      } catch (err) {
        showError('Network error connecting to authentication server. Please retry.');
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Cockpit</span>';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearAlerts();
      const channelName = document.getElementById('reg-channel').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-reg-submit');

      btn.disabled = true;
      btn.innerHTML = '<span>Creating your account...</span>';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channelName, email, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          showSuccess('Account created! Initializing your stream cockpit...');
          localStorage.setItem('denalerts_auth_token', data.token);
          localStorage.setItem('denalerts_user', JSON.stringify(data.user));
          localStorage.setItem('stream_session_code', data.user.streamerKey);
          localStorage.setItem('streamer_code', data.user.streamerKey);

          setTimeout(() => {
            window.location.href = `/dashboard?code=${encodeURIComponent(data.user.streamerKey)}`;
          }, 500);
        } else {
          showError(data.error || 'Failed to create account. Please check your details.');
          btn.disabled = false;
          btn.innerHTML = '<span>Create Streamer Account</span>';
        }
      } catch (err) {
        showError('Network error connecting to authentication server. Please retry.');
        btn.disabled = false;
        btn.innerHTML = '<span>Create Streamer Account</span>';
      }
    }

    // Auto-check if already logged in
    (async function checkExistingAuth() {
      const token = localStorage.getItem('denalerts_auth_token');
      if (token) {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data.success && data.user) {
            window.location.replace(`/dashboard?code=${encodeURIComponent(data.user.streamerKey)}`);
          }
        } catch (_) {}
      }
    })();
  </script>
</body>
</html>
